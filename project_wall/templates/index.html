<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ProjectWall</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">🧱 ProjectWall</div>
    <div class="meta">
      <input id="search" type="search" placeholder="filter by name, id, stack…" autocomplete="off" spellcheck="false" />
      <span id="summary">…</span>
      <button id="refresh" type="button">Refresh</button>
    </div>
  </header>

  <main id="grid" class="grid">
    {% for p in projects %}
    <section class="card" data-id="{{ p.id }}" data-search="{{ (p.id ~ ' ' ~ p.name ~ ' ' ~ p.stack)|lower }}" style="--accent: {{ p.color }}">
      <header class="card-head">
        <span class="icon">{{ p.icon }}</span>
        <h2>{{ p.name }}</h2>
        <span class="stack">{{ p.stack }}</span>
      </header>
      <div class="status">
        <span class="dot" data-state="idle"></span>
        <span class="state-label">idle</span>
        <span class="health" data-health="unknown">health: —</span>
      </div>
      <div class="links">
        {% if p.live_url %}<a href="{{ p.live_url }}" target="_blank" rel="noopener">Live</a>{% endif %}
        {% if p.obsidian %}<a href="{{ p.obsidian }}">Notes</a>{% endif %}
      </div>
      <div class="actions">
        <button class="start" type="button">Start</button>
        <button class="stop"  type="button" disabled>Stop</button>
        <button class="logs"  type="button" disabled>Logs</button>
        {% if p.local_url %}<a class="btn-open disabled" href="{{ p.local_url }}" target="_blank" rel="noopener">Open ↗</a>{% endif %}
      </div>
      <pre class="crash" hidden></pre>
      <pre class="logview" hidden></pre>
    </section>
    {% endfor %}
  </main>

  <script src="/static/app.js"></script>
</body>
</html>

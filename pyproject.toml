[project]
name = "project-wall"
version = "0.1.0"
description = "Central launcher dashboard for local dev projects"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "psutil>=6.0",
    "httpx>=0.27",
    "click>=8.1",
]

[project.optional-dependencies]
tray = ["pystray>=0.19", "pillow>=10.0"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "playwright>=1.48",
    "pytest-playwright>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers --browser chromium"

[project.scripts]
wall = "cli.wall:cli"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["project_wall*", "cli*"]
